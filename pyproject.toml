[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "noark5-workflow-manager"
version = "0.1.3"
description = "Noark 5 Workflow Manager"
requires-python = ">=3.10"

[project.scripts]
n5wf = "noark5_workflow.cli:main"

[tool.setuptools.packages.find]
include = ["noark5_workflow*", "app*"]

[tool.setuptools]
py-modules = ["settings", "version"]
