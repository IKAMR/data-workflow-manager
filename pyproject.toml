[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
# Technical distribution identity is intentionally retained for compatibility.
# Distribution and application versions represent the same development milestone.
name = "noark5-workflow-manager"
version = "0.1.9a2"
description = "Data Workflow Manager"
requires-python = ">=3.10"

[project.scripts]
n5wf = "noark5_workflow.cli:main"

[tool.setuptools.packages.find]
include = ["noark5_workflow*", "app*"]

[tool.setuptools]
py-modules = ["settings", "version"]
